<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Admission Dots</title>
  <desc id="desc">Candidate dots narrow into one accepted model.</desc>
  <defs>
    <circle id="candidate" r="4" fill="currentColor"/>
  </defs>
  <g opacity=".32">
    <use href="#candidate" x="25" y="27"/><use href="#candidate" x="50" y="27"/><use href="#candidate" x="75" y="27"/>
    <use href="#candidate" x="34" y="44"/><use href="#candidate" x="50" y="44"/><use href="#candidate" x="66" y="44"/>
    <use href="#candidate" x="42" y="60"/><use href="#candidate" x="58" y="60"/>
  </g>
  <circle cx="50" cy="77" r="7" fill="currentColor"/>
</svg>
