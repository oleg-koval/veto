<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Veto — cost-aware AI model routing</title>
  <desc id="desc">Veto selects the cheapest viable model through explicit admission decisions.</desc>
  <defs>
    <linearGradient id="decision" x1="150" y1="385" x2="318" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3de7ff"/>
      <stop offset="1" stop-color="#ffb84a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(260 315) rotate(90) scale(280)">
      <stop stop-color="#12323d"/>
      <stop offset="1" stop-color="#071014" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#071014"/>
  <circle cx="260" cy="315" r="280" fill="url(#glow)"/>
  <path d="M0 92h1200M0 538h1200" stroke="#17313a"/>
  <g transform="translate(96 151) scale(3.3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="94" height="94" rx="22" fill="#09151a" stroke="#193a45" stroke-width=".5"/>
    <path d="M34 24H25a6 6 0 0 0-6 6v40a6 6 0 0 0 6 6h9" stroke="#3de7ff" stroke-width="4" opacity=".42"/>
    <path d="M66 24h9a6 6 0 0 1 6 6v40a6 6 0 0 1-6 6h-9" stroke="#3de7ff" stroke-width="4" opacity=".42"/>
    <path d="m34 50 11 11 22-25" stroke="url(#decision)" stroke-width="7"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="510" y="194" fill="#3de7ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="4">AI MODEL ROUTER</text>
    <text x="505" y="294" fill="#e7f8ff" font-size="92" font-weight="760" letter-spacing="-5">veto</text>
    <text x="510" y="354" fill="#a6bcc5" font-size="30">The model should earn the task.</text>
    <text x="510" y="425" fill="#e7f8ff" font-size="20">cost-aware filtering  ·  explicit admission  ·  multi-provider</text>
    <rect x="510" y="470" width="510" height="54" rx="10" fill="#0d1d23" stroke="#23424d"/>
    <text x="535" y="504" fill="#ffb84a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">brew install oleg-koval/tap/veto</text>
  </g>
</svg>
