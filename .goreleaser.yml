version: 2

builds:
  - id: veto
    main: ./cmd/veto
    binary: veto
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.buildProvenance=official
    hooks:
      post:
        - cmd: >-
            ./scripts/package-release.sh --verify-binary
            "{{ index .Env "VETO_BINARY_MANIFEST" }}" "{{ .Path }}"
            "{{ .Version }}" "{{ .Os }}" "{{ .Arch }}"

archives:
  - id: veto
    ids:
      - veto
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - no-extra-files-match-this-pattern*
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: SHA256SUMS

release:
  name_template: "Veto {{ .Tag }} beta"
  prerelease: "false"
  mode: keep-existing
  extra_files:
    - glob: .release-preflight/BINARY_SHA256SUMS
      name_template: BINARY_SHA256SUMS
