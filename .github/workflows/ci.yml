name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Build onboarding smoke binary
        run: go build -o "$RUNNER_TEMP/veto-onboarding" ./cmd/veto

      - name: Fresh-home onboarding smoke
        env:
          VETO_BINARY: ${{ runner.temp }}/veto-onboarding
        run: ./scripts/onboarding-smoke.sh

      - name: Agent skill compatibility smoke
        run: ./scripts/agent-skill-smoke.sh

      - name: Offline routing benchmark smoke
        run: |
          go run ./cmd/veto benchmark --corpus internal/eval/testdata/routing_corpus.json > "$RUNNER_TEMP/veto-benchmark.json"
          python3 -m json.tool "$RUNNER_TEMP/veto-benchmark.json" >/dev/null

      - name: Test (race detector)
        run: go test -race -timeout 120s ./...

      - name: Vet
        run: go vet ./...

      - name: Release packaging dry run
        run: ./scripts/package-release.sh v0.0.0 "$RUNNER_TEMP/veto-release-dist"

      - name: Debian package smoke builds
        run: |
          set -euo pipefail
          release_dist="$RUNNER_TEMP/veto-release-dist"
          package_dist="$RUNNER_TEMP/veto-package-smoke"
          mkdir -p "$package_dist"

          for spec in "amd64 linux_amd64" "arm64 linux_arm64"; do
            read -r deb_arch archive_arch <<<"$spec"
            extract_dir=$(mktemp -d)
            tar -xzf "$release_dist/veto_0.0.0_${archive_arch}.tar.gz" -C "$extract_dir"
            binary=$(find "$extract_dir" -type f -name veto -print -quit)
            ./scripts/build-deb.sh 0.0.0 "$deb_arch" "$binary" "$package_dist"
            dpkg-deb --info "$package_dist/veto_0.0.0_${deb_arch}.deb" >/dev/null
            dpkg-deb --contents "$package_dist/veto_0.0.0_${deb_arch}.deb" \
              >"$package_dist/veto_0.0.0_${deb_arch}.contents"
            grep -Fq './usr/bin/veto' "$package_dist/veto_0.0.0_${deb_arch}.contents"
            rm -rf "$extract_dir"
          done

      - name: Arch package smoke build
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/veto-arch-smoke"
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/veto-release-dist:/release:ro" \
            --volume "$RUNNER_TEMP/veto-arch-smoke:/output" \
            archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d \
            bash -euc '
              pacman -Syu --noconfirm --needed base-devel
              useradd --create-home builder
              chown builder:builder /output
              su builder -s /bin/bash -c "/work/scripts/build-arch-package.sh 0.0.0 /release/veto_0.0.0_linux_amd64.tar.gz /output"
              pacman -Qp /output/veto-bin-0.0.0-1-x86_64.pkg.tar.zst | grep -Fq "veto-bin 0.0.0-1"
            '

      - name: Homebrew formula rendering smoke
        run: |
          ./scripts/render-homebrew-formula.sh \
            v0.0.0 \
            "$RUNNER_TEMP/veto-release-dist/SHA256SUMS" \
            "$RUNNER_TEMP/veto.rb"
          grep -Fq '/v0.0.0/veto_0.0.0_darwin_arm64.tar.gz' "$RUNNER_TEMP/veto.rb"

      - name: Validate GitHub issue forms
        run: python3 scripts/validate-github-forms.py

      - name: Test contributor governance rules
        run: node --test .github/scripts/contributor-governance.test.js

      - name: Test OpenCode integration contracts
        run: node --test integrations/opencode/*.test.mjs

      - name: Test Hermes integration contracts
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          python3 -m unittest integrations/hermes/veto/runtime_test.py
          "$RUNNER_TEMP/veto-onboarding" hermes plugin install
          "$RUNNER_TEMP/veto-onboarding" hermes plugin status
          "$RUNNER_TEMP/veto-onboarding" hermes plugin uninstall
