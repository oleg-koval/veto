name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release metadata
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo "HOMEBREW_TAP_TOKEN is required to update oleg-koval/homebrew-tap" >&2
            exit 1
          }
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # A release must be at least as healthy as a pull request before any
      # artifacts are created or the GitHub Release is published.
      - name: Run release gates
        run: |
          set -euo pipefail
          go test -race -timeout 120s ./...
          go vet ./...
          go build ./cmd/veto
          go build -o "$RUNNER_TEMP/veto-onboarding" ./cmd/veto
          VETO_BINARY="$RUNNER_TEMP/veto-onboarding" ./scripts/onboarding-smoke.sh
          go run ./cmd/veto benchmark \
            --corpus internal/eval/testdata/routing_corpus.json \
            > "$RUNNER_TEMP/veto-benchmark.json"
          python3 -m json.tool "$RUNNER_TEMP/veto-benchmark.json" >/dev/null

      - name: Build and publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
