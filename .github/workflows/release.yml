name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release metadata
        run: |
          set -euo pipefail
          ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"

      # A release must be at least as healthy as a pull request before any
      # artifacts are created or the GitHub Release is published.
      - name: Run release gates
        run: |
          set -euo pipefail
          go test -race -timeout 120s ./...
          go vet ./...
          go build ./cmd/veto
          go build -o "$RUNNER_TEMP/veto-onboarding" ./cmd/veto
          VETO_BINARY="$RUNNER_TEMP/veto-onboarding" ./scripts/onboarding-smoke.sh
          go run ./cmd/veto benchmark \
            --corpus internal/eval/testdata/routing_corpus.json \
            > "$RUNNER_TEMP/veto-benchmark.json"
          python3 -m json.tool "$RUNNER_TEMP/veto-benchmark.json" >/dev/null

      - name: Build and validate release artifacts
        run: ./scripts/package-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/veto-release-preflight"

      - name: Build and publish release with Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VETO_BINARY_MANIFEST: ${{ runner.temp }}/veto-release-preflight/BINARY_SHA256SUMS

      - name: Build and publish release without Homebrew cask
        if: env.HOMEBREW_TAP_TOKEN == ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --skip=homebrew --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VETO_BINARY_MANIFEST: ${{ runner.temp }}/veto-release-preflight/BINARY_SHA256SUMS
