name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          ./scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      # A release must be at least as healthy as a pull request before any
      # artifacts are created or the GitHub Release is published.
      - name: Run release gates
        run: |
          set -euo pipefail
          go test -race -timeout 120s ./...
          go vet ./...
          go build ./cmd/veto
          go build -o "$RUNNER_TEMP/veto-onboarding" ./cmd/veto
          VETO_BINARY="$RUNNER_TEMP/veto-onboarding" ./scripts/onboarding-smoke.sh
          go run ./cmd/veto benchmark \
            --corpus internal/eval/testdata/routing_corpus.json \
            > "$RUNNER_TEMP/veto-benchmark.json"
          python3 -m json.tool "$RUNNER_TEMP/veto-benchmark.json" >/dev/null

      - name: Build and validate release artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: ./scripts/package-release.sh "$RELEASE_TAG" "$GITHUB_WORKSPACE/.release-preflight"

      - name: Build and publish GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VETO_BINARY_MANIFEST: .release-preflight/BINARY_SHA256SUMS

      - name: Build Debian packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          DIST="$GITHUB_WORKSPACE/dist"

          for GOARCH in amd64 arm64; do
            ARCHIVE="$DIST/veto_${VERSION}_linux_${GOARCH}.tar.gz"
            EXTRACT="$(mktemp -d)"
            tar -xzf "$ARCHIVE" -C "$EXTRACT"
            BINARY="$(find "$EXTRACT" -type f -name veto -print -quit)"
            DEB_ARCH=amd64
            if [[ "$GOARCH" == arm64 ]]; then
              DEB_ARCH=arm64
            fi
            ./scripts/build-deb.sh "$VERSION" "$DEB_ARCH" "$BINARY" "$DIST"
            rm -rf "$EXTRACT"
          done

      - name: Build Arch package
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${RELEASE_TAG}^{commit}")"
          DIST="$GITHUB_WORKSPACE/dist"
          mkdir -p "$RUNNER_TEMP/veto-arch-output"

          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/work:ro" \
            --volume "$RUNNER_TEMP/veto-arch-output:/output" \
            --env RELEASE_VERSION="$VERSION" \
            --env SOURCE_DATE_EPOCH \
            archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d \
            bash -euc '
              pacman -Syu --noconfirm --needed base-devel
              useradd --create-home builder
              mkdir -p /tmp/veto-build/scripts /tmp/veto-build/packaging/arch /tmp/veto-build/dist
              cp /work/scripts/build-arch-package.sh /tmp/veto-build/scripts/
              cp /work/packaging/arch/PKGBUILD.in /tmp/veto-build/packaging/arch/
              cp "/work/dist/veto_${RELEASE_VERSION}_linux_amd64.tar.gz" /tmp/veto-build/
              chown -R builder:builder /tmp/veto-build
              su builder -s /bin/bash -c "/tmp/veto-build/scripts/build-arch-package.sh ${RELEASE_VERSION} /tmp/veto-build/veto_${RELEASE_VERSION}_linux_amd64.tar.gz /tmp/veto-build/dist"
              cp /tmp/veto-build/dist/*.pkg.tar.zst /output/
            '

          cp "$RUNNER_TEMP/veto-arch-output"/*.pkg.tar.zst "$DIST/"

      - name: Verify and upload Linux package artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          DIST="$GITHUB_WORKSPACE/dist"
          test -f "$DIST/veto_${VERSION}_amd64.deb"
          test -f "$DIST/veto_${VERSION}_arm64.deb"
          test -f "$DIST/veto-bin-${VERSION}-1-x86_64.pkg.tar.zst"
          (cd "$DIST" && sha256sum veto_*.deb veto-bin-*.pkg.tar.zst > PACKAGE_SHA256SUMS)
          (cd "$DIST" && sha256sum -c PACKAGE_SHA256SUMS)
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "$DIST"/*.deb "$DIST"/*.pkg.tar.zst "$DIST/PACKAGE_SHA256SUMS" \
            --clobber

      - name: Render Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          ./scripts/render-homebrew-formula.sh
          "$RELEASE_TAG" dist/SHA256SUMS
          "$RUNNER_TEMP/veto.rb"

      - name: Check out Homebrew tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: oleg-koval/homebrew-tap
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Publish Homebrew formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          install -m 0644 "$RUNNER_TEMP/veto.rb" homebrew-tap/Formula/veto.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/veto.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula already matches $RELEASE_TAG"
            exit 0
          fi
          git commit -m "veto $RELEASE_TAG"
          git push origin HEAD:main

      - name: Report skipped Homebrew publication
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: >-
          echo "::warning::HOMEBREW_TAP_TOKEN is not configured;
          the GitHub release was published without updating Homebrew."
