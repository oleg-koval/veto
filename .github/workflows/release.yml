name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A release must be at least as healthy as a pull request before any
      # artifacts are created or the GitHub Release is published.
      - name: Run release gates
        run: |
          set -euo pipefail
          go test -race -timeout 120s ./...
          go vet ./...
          go build ./...

      - name: Build archives and checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH (got $TAG_NAME)" >&2
            exit 1
          fi

          VERSION="${TAG_NAME#v}"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT
          mkdir -p "$DIST"

          LDFLAGS="-s -w -X main.version=$VERSION"
          while IFS=' ' read -r GOOS GOARCH; do
            ARTIFACT="veto_${VERSION}_${GOOS}_${GOARCH}"
            ROOT="$STAGE/$ARTIFACT"
            mkdir -p "$ROOT"

            BINARY="$ROOT/veto"
            if [[ "$GOOS" == "windows" ]]; then
              BINARY="$ROOT/veto.exe"
            fi

            GOOS="$GOOS" GOARCH="$GOARCH" go build \
              -trimpath -ldflags "$LDFLAGS" -o "$BINARY" ./cmd/veto

            if [[ "$GOOS" == "windows" ]]; then
              (cd "$STAGE" && zip -q -r "$DIST/$ARTIFACT.zip" "$ARTIFACT")
            else
              tar -C "$STAGE" -czf "$DIST/$ARTIFACT.tar.gz" "$ARTIFACT"
            fi
          done <<'TARGETS'
          darwin arm64
          darwin amd64
          linux amd64
          linux arm64
          windows amd64
          windows arm64
          TARGETS

          (cd "$DIST" && sha256sum veto_* > SHA256SUMS)

          # Verify the exact files that will be uploaded and reject an empty
          # or malformed artifact set before the publish step can run.
          test "$(find "$DIST" -maxdepth 1 -type f -name 'veto_*' | wc -l)" -eq 6
          (cd "$DIST" && sha256sum -c SHA256SUMS)
          grep -q "veto_${VERSION}_linux_arm64.tar.gz" "$DIST/SHA256SUMS"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
