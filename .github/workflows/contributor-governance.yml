name: Contributor Governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  contributor-governance:
    name: Contributor governance
    runs-on: ubuntu-latest
    steps:
      # pull_request_target checks out the base revision so untrusted PR code
      # cannot change the policy or the check before it runs.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/github-script@v7
        with:
          script: |
            const governance = require('./.github/scripts/contributor-governance.js');
            await governance.run({
              github,
              context,
              core,
              policyPath: '.github/contributor-policy.json',
            });
