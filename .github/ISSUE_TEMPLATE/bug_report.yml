name: Bug report
description: Report a reproducible problem in Veto
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction_context
    attributes:
      label: Reproduction or context
      description: Safe commands and steps that reproduce the problem. Do not include secrets or proprietary task text.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and environment
      description: Veto version, OS, architecture, command name, and affected scope only.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: A checklist of observable conditions that would make this issue complete.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: regression_status
    attributes:
      label: Regression status
      description: What was checked for regressions, or state that this is not assessed yet.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional safe logs, tests, screenshots, or benchmark evidence. Redact secrets and local paths.
